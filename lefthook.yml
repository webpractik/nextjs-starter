#   Refer for explanation to following link:
#   https://lefthook.dev/configuration/
#
pre-commit:
    jobs:
        - name: format
          run: npm run fmt -- --no-error-on-unmatched-pattern {staged_files}
          glob: '*.{js,mjs,jsx,ts,mts,tsx,md,json,jsonc,yaml,yml,toml,html,css}'
          stage_fixed: true
        - name: verify
          run: npm run verify:fast

prepare-commit-msg:
    commands:
        commitizen:
            skip:
                - merge
            interactive: true
            run: npx cz --hook
            env:
                LEFTHOOK: '0'
